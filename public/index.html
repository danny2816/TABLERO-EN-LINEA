<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablero Interactivo</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #toolbar {
      background-color: #f0f0f0;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      border-bottom: 2px solid #ccc;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #ddd;
    }

    button, select, input {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
      cursor: pointer;
    }

    button.active {
      background-color: #007bff;
      color: white;
      border-color: #0056b3;
    }

    #canvas-container {
      flex: 1;
      position: relative;
      background-color: #fafafa;
    }

    canvas {
      display: block;
      cursor: crosshair;
    }

    /* Caja de texto editable en lienzo */
    .text-box {
      position: absolute;
      border: 1px dashed #007bff;
      background: transparent;
      outline: none;
      font-family: sans-serif;
      font-size: 18px;
      color: #000;
      padding: 2px 4px;
      min-width: 50px;
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <!-- Modo de Dibujo / Selección -->
    <div class="tool-group">
      <button id="btn-pencil" class="active" onclick="setMode('pencil')">✏️ Lápiz</button>
      <button id="btn-text" onclick="setMode('text')">🔤 Texto</button>
    </div>

    <!-- Ajustes de Borrador -->
    <div class="tool-group">
      <button id="btn-eraser" onclick="setMode('eraser')">🧹 Borrador</button>
      <label for="eraser-type">Tipo:</label>
      <select id="eraser-type" onchange="updateEraserType(this.value)">
        <option value="precision">Por Trazo / Objeto</option>
        <option value="area">Por Área (Pincel)</option>
      </select>
      <label for="eraser-size">Tamaño:</label>
      <input type="range" id="eraser-size" min="5" max="100" value="20" oninput="updateEraserSize(this.value)">
      <span id="eraser-size-val">20px</span>
    </div>

    <!-- Operaciones Desplegables y Editables -->
    <div class="tool-group">
      <label for="op-category">Operación:</label>
      <select id="op-category" onchange="loadOperations(this.value)">
        <option value="algebra">Álgebra</option>
        <option value="calculo">Cálculo</option>
        <option value="geometria">Geometría</option>
      </select>

      <select id="op-list">
        <!-- Opciones dinámicas -->
      </select>

      <input type="text" id="op-edit" placeholder="Editar fórmula..." style="width: 140px;">
      <button onclick="addOperationToCanvas()">Insertar</button>
    </div>

    <div class="tool-group">
      <button onclick="clearCanvas()" style="background-color: #ff4d4d; color: white;">🗑️ Limpiar Todo</button>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="board"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    let currentMode = 'pencil'; // 'pencil', 'eraser', 'text'
    let eraserType = 'precision'; // 'precision' o 'area'
    let eraserSize = 20;

    let isDrawing = false;
    let paths = []; // Trazos guardados: { id, points: [{x, y}], size, color }
    let texts = []; // Textos guardados: { id, x, y, content, size, color }
    let currentPath = [];

    // Banco de operaciones predefinidas para el desplegable
    const operationsData = {
      algebra: ['a² + b² = c²', 'x = (-b ± √(b² - 4ac)) / 2a', '|x - a| < ε'],
      calculo: ['∫ f(x) dx', 'lim (x→0) (sin x / x) = 1', 'f\'(x) = dy/dx'],
      geometria: ['A = π · r²', 'P = 2πr', 'V = (4/3)πr³']
    };

    function resizeCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      redraw();
    }
    window.addEventListener('resize', resizeCanvas);

    // Ajustar modo
    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('active'));
      if (mode === 'pencil') document.getElementById('btn-pencil').classList.add('active');
      if (mode === 'eraser') document.getElementById('btn-eraser').classList.add('active');
      if (mode === 'text') document.getElementById('btn-text').classList.add('active');
    }

    function updateEraserSize(val) {
      eraserSize = parseInt(val);
      document.getElementById('eraser-size-val').innerText = `${val}px`;
    }

    function updateEraserType(type) {
      eraserType = type;
    }

    // Dibujo y borrado puntual
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (currentMode === 'pencil') {
        isDrawing = true;
        currentPath = [{ x, y }];
      } else if (currentMode === 'eraser') {
        if (eraserType === 'precision') {
          eraseAtPoint(x, y);
        } else {
          isDrawing = true;
          eraseArea(x, y);
        }
      } else if (currentMode === 'text') {
        createEditableText(x, y);
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (isDrawing && currentMode === 'pencil') {
        currentPath.push({ x, y });
        redraw();
        drawPath(currentPath, '#000', 3);
      } else if (isDrawing && currentMode === 'eraser' && eraserType === 'area') {
        eraseArea(x, y);
      }
    });

    canvas.addEventListener('mouseup', () => {
      if (isDrawing && currentMode === 'pencil') {
        paths.push({ id: Date.now(), points: currentPath, size: 3, color: '#000' });
        currentPath = [];
      }
      isDrawing = false;
    });

    // Redibujar todo el lienzo
    function redraw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      paths.forEach(p => drawPath(p.points, p.color, p.size));
      
      texts.forEach(t => {
        ctx.font = `${t.size}px sans-serif`;
        ctx.fillStyle = t.color;
        ctx.fillText(t.content, t.x, t.y);
      });
    }

    function drawPath(points, color, size) {
      if (points.length < 2) return;
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = size;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.stroke();
    }

    // Lógica del borrador por trazo/objeto completo
    function eraseAtPoint(x, y) {
      const threshold = eraserSize / 2;
      paths = paths.filter(p => !p.points.some(pt => Math.hypot(pt.x - x, pt.y - y) < threshold));
      texts = texts.filter(t => Math.hypot(t.x - x, t.y - y) > threshold * 1.5);
      redraw();
    }

    // Lógica del borrador por área (elimina fragmentos)
    function eraseArea(x, y) {
      const r = eraserSize / 2;
      paths.forEach(p => {
        p.points = p.points.filter(pt => Math.hypot(pt.x - x, pt.y - y) > r);
      });
      paths = paths.filter(p => p.points.length > 1);
      texts = texts.filter(t => Math.hypot(t.x - x, t.y - y) > r);
      redraw();
    }

    // Insertar texto flotante e interactivo
    function createEditableText(x, y) {
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'text-box';
      input.style.left = `${x}px`;
      input.style.top = `${y}px`;

      container.appendChild(input);
      input.focus();

      input.addEventListener('blur', () => {
        if (input.value.trim() !== '') {
          texts.push({
            id: Date.now(),
            x: x,
            y: y + 16,
            content: input.value,
            size: 18,
            color: '#000'
          });
          redraw();
        }
        container.removeChild(input);
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') input.blur();
      });
    }

    // Cargar operaciones en los desplegables
    function loadOperations(category) {
      const opList = document.getElementById('op-list');
      opList.innerHTML = '';
      operationsData[category].forEach(op => {
        const option = document.createElement('option');
        option.value = op;
        option.innerText = op;
        opList.appendChild(option);
      });
      syncOpEdit();
    }

    function syncOpEdit() {
      const opList = document.getElementById('op-list');
      document.getElementById('op-edit').value = opList.value || '';
    }

    document.getElementById('op-list').addEventListener('change', syncOpEdit);

    function addOperationToCanvas() {
      const text = document.getElementById('op-edit').value;
      if (!text) return;
      
      texts.push({
        id: Date.now(),
        x: canvas.width / 2 - 50,
        y: canvas.height / 2,
        content: text,
        size: 22,
        color: '#000'
      });
      redraw();
    }

    function clearCanvas() {
      paths = [];
      texts = [];
      redraw();
    }

    // Inicialización
    loadOperations('algebra');
    resizeCanvas();
  </script>
</body>
</html>
