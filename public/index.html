<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tablero Matemático Interactivo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a2e; color: #fff; }
    
    #toolbar {
      position: absolute; top: 0; left: 0; right: 0; height: 50px;
      background: #16213e; display: flex; align-items: center; padding: 0 10px; gap: 8px;
      z-index: 10; border-bottom: 1px solid #0f3460; overflow-x: auto; white-space: nowrap;
    }
    #toolbar select, #toolbar button, #toolbar input {
      background: #0f3460; color: #fff; border: 1px solid #1f4068; padding: 6px 10px;
      border-radius: 6px; font-size: 13px; cursor: pointer; outline: none; font-weight: 500;
    }
    #toolbar button:hover, #toolbar select:hover { background: #1f4068; }
    
    #canvas-container { 
      position: absolute; top: 50px; bottom: 0; left: 0; right: 0; 
      background: #ffffff; cursor: crosshair; touch-action: none; 
    }
    canvas { display: block; width: 100%; height: 100%; }
    
    .btn-danger { background: #e94560 !important; border-color: #e94560 !important; }
    .btn-danger:hover { background: #c0354e !important; }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <div id="toolbar">
    <select id="toolSelect">
      <option value="pen">✏️ Lápiz</option>
      <option value="select">🖐️ Mover Objeto</option>
      <option value="pan">✋ Desplazar Pantalla</option>
      <option value="line">📏 Línea Recta</option>
      <option value="numberline">🔢 Recta Numérica</option>
      <option value="cartesian">📈 Plano Cartesiano</option>
      <option value="eraser">🧹 Borrador</option>
    </select>

    <input type="color" id="colorPicker" value="#000000">
    <select id="lineWidth">
      <option value="2">Fino (2px)</option>
      <option value="4" selected>Medio (4px)</option>
      <option value="8">Grueso (8px)</option>
    </select>

    <button onclick="insertSymbol('|x|')">|x|</button>
    <button onclick="insertSymbol('|-a|=a')">|-a|=a</button>
    <button onclick="insertSymbol('π')">π</button>
    <button onclick="insertSymbol('√x')">√x</button>
    <button onclick="insertSymbol('∛x')">∛x</button>
    <button onclick="insertSymbol('f(x)')">f(x)</button>

    <button onclick="zoom(1.15)">🔍 +</button>
    <button onclick="zoom(0.85)">🔍 -</button>
    <button onclick="resetZoom()">Centrar Vista</button>

    <button class="btn-danger" onclick="clearBoard()">Limpiar Tablero</button>
  </div>

  <div id="canvas-container">
    <canvas id="board"></canvas>
  </div>

  <script>
    const socket = io();
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    let elements = [];
    let currentPath = null;

    let tool = 'pen';
    let color = '#000000';
    let size = 4;

    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;

    let isDrawing = false;
    let startX = 0, startY = 0;
    let lastMousePos = { x: 0, y: 0 };
    let selectedElement = null;
    let lastEmitTime = 0;

    function resizeCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      redraw();
    }
    window.addEventListener('resize', resizeCanvas);

    document.getElementById('toolSelect').addEventListener('change', (e) => {
      tool = e.target.value;
      canvas.style.cursor = tool === 'pan' ? 'grab' : (tool === 'select' ? 'pointer' : 'crosshair');
    });
    document.getElementById('colorPicker').addEventListener('change', (e) => color = e.target.value);
    document.getElementById('lineWidth').addEventListener('change', (e) => size = parseInt(e.target.value));

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left - offsetX) / scale,
        y: (clientY - rect.top - offsetY) / scale,
        rawX: clientX - rect.left,
        rawY: clientY - rect.top
      };
    }

    function startAction(e) {
      if (e.touches && e.touches.length > 1) return;
      isDrawing = true;
      const pos = getPos(e);
      startX = pos.x;
      startY = pos.y;
      lastMousePos = { x: pos.rawX, y: pos.rawY };

      if (tool === 'pen') {
        currentPath = { id: Date.now() + Math.random(), type: 'path', color, size, points: [{ x: pos.x, y: pos.y }] };
      } else if (tool === 'select') {
        selectedElement = elements.slice().reverse().find(el => isNearElement(pos, el));
      } else if (tool === 'eraser') {
        removeNearElements(pos);
      } else if (tool === 'cartesian') {
        const cart = { id: Date.now(), type: 'cartesian', x: pos.x, y: pos.y, size: 150, color, size: 2 };
        elements.push(cart);
        socket.emit('draw', cart);
        redraw();
        isDrawing = false;
      } else if (tool === 'numberline') {
        const nl = { id: Date.now(), type: 'numberline', x: pos.x, y: pos.y, length: 300, color, size: 2 };
        elements.push(nl);
        socket.emit('draw', nl);
        redraw();
        isDrawing = false;
      }
    }

    function moveAction(e) {
      if (!isDrawing) return;
      const pos = getPos(e);

      if (tool === 'pan') {
        const dx = pos.rawX - lastMousePos.x;
        const dy = pos.rawY - lastMousePos.y;
        offsetX += dx;
        offsetY += dy;
        lastMousePos = { x: pos.rawX, y: pos.rawY };
        redraw();
        return;
      }

      if (tool === 'pen' && currentPath) {
        currentPath.points.push({ x: pos.x, y: pos.y });
        redraw();
        drawElement(currentPath);
      } else if (tool === 'select' && selectedElement) {
        const dx = pos.x - startX;
        const dy = pos.y - startY;
        moveElement(selectedElement, dx, dy);
        startX = pos.x;
        startY = pos.y;
        redraw();
        
        const now = Date.now();
        if (now - lastEmitTime > 40) {
          socket.emit('update-board', elements);
          lastEmitTime = now;
        }
      } else if (tool === 'eraser') {
        removeNearElements(pos);
      }
    }

    function endAction() {
      if (!isDrawing) return;
      isDrawing = false;

      if (tool === 'pen' && currentPath) {
        elements.push(currentPath);
        socket.emit('draw', currentPath);
        currentPath = null;
      } else if (tool === 'line') {
        const line = { id: Date.now(), type: 'line', x1: startX, y1: startY, x2: lastMousePos.x ? (lastMousePos.x - offsetX)/scale : startX + 100, y2: lastMousePos.y ? (lastMousePos.y - offsetY)/scale : startY, color, size };
        elements.push(line);
        socket.emit('draw', line);
        redraw();
      } else if (tool === 'select' && selectedElement) {
        socket.emit('update-board', elements);
        selectedElement = null;
      }
    }

    canvas.addEventListener('mousedown', startAction);
    canvas.addEventListener('mousemove', moveAction);
    canvas.addEventListener('mouseup', endAction);

    canvas.addEventListener('touchstart', (e) => { startAction(e); }, { passive: true });
    canvas.addEventListener('touchmove', (e) => { moveAction(e); }, { passive: true });
    canvas.addEventListener('touchend', endAction);

    function insertSymbol(text) {
      const pos = { x: (canvas.width / 2 - offsetX) / scale, y: (canvas.height / 2 - offsetY) / scale };
      const elem = { id: Date.now(), type: 'text', text, x: pos.x, y: pos.y, color, size: 28 };
      elements.push(elem);
      socket.emit('draw', elem);
      redraw();
    }

    function drawElement(el) {
      ctx.strokeStyle = el.color || '#000';
      ctx.fillStyle = el.color || '#000';
      ctx.lineWidth = el.size || 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (el.type === 'path') {
        if (!el.points || el.points.length < 2) return;
        ctx.beginPath();
        ctx.moveTo(el.points[0].x, el.points[0].y);
        for (let i = 1; i < el.points.length; i++) {
          ctx.lineTo(el.points[i].x, el.points[i].y);
        }
        ctx.stroke();
      } else if (el.type === 'text') {
        ctx.font = `bold ${el.size || 28}px sans-serif`;
        ctx.fillText(el.text, el.x, el.y);
      } else if (el.type === 'line') {
        ctx.beginPath();
        ctx.moveTo(el.x1, el.y1);
        ctx.lineTo(el.x2, el.y2);
        ctx.stroke();
      } else if (el.type === 'numberline') {
        ctx.beginPath();
        ctx.moveTo(el.x - el.length/2, el.y);
        ctx.lineTo(el.x + el.length/2, el.y);
        ctx.stroke();
        const step = el.length / 10;
        for (let i = 0; i <= 10; i++) {
          let tx = (el.x - el.length/2) + step * i;
          ctx.beginPath();
          ctx.moveTo(tx, el.y - 6);
          ctx.lineTo(tx, el.y + 6);
          ctx.stroke();
          ctx.font = '12px sans-serif';
          ctx.fillText(i - 5, tx - 6, el.y + 22);
        }
      } else if (el.type === 'cartesian') {
        const s = el.size || 150;
        // Ejes X e Y
        ctx.beginPath();
        ctx.moveTo(el.x - s, el.y); ctx.lineTo(el.x + s, el.y);
        ctx.moveTo(el.x, el.y - s); ctx.lineTo(el.x, el.y + s);
        ctx.stroke();

        // Marcas de graduación
        const gridStep = s / 5;
        ctx.font = '10px sans-serif';
        for(let i = -5; i <= 5; i++) {
          if(i === 0) continue;
          // Eje X
          let markX = el.x + i * gridStep;
          ctx.beginPath(); ctx.moveTo(markX, el.y - 4); ctx.lineTo(markX, el.y + 4); ctx.stroke();
          ctx.fillText(i, markX - 4, el.y + 15);

          // Eje Y
          let markY = el.y - i * gridStep;
          ctx.beginPath(); ctx.moveTo(el.x - 4, markY); ctx.lineTo(el.x + 4, markY); ctx.stroke();
          ctx.fillText(i, el.x + 8, markY + 3);
        }

        // Etiquetas X e Y
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText("X", el.x + s + 8, el.y + 4);
        ctx.fillText("Y", el.x - 4, el.y - s - 8);
      }
    }

    function redraw() {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);
      elements.forEach(drawElement);
      if (currentPath) drawElement(currentPath);
      ctx.restore();
    }

    function isNearElement(pos, el) {
      if (el.type === 'text' || el.type === 'numberline' || el.type === 'cartesian') {
        return Math.hypot(pos.x - el.x, pos.y - el.y) < 80;
      }
      if (el.type === 'line') {
        return Math.hypot(pos.x - el.x1, pos.y - el.y1) < 50;
      }
      if (el.type === 'path' && el.points) {
        return el.points.some(p => Math.hypot(pos.x - p.x, pos.y - p.y) < 20);
      }
      return false;
    }

    function moveElement(el, dx, dy) {
      if (el.type === 'text' || el.type === 'numberline' || el.type === 'cartesian') {
        el.x += dx; el.y += dy;
      } else if (el.type === 'line') {
        el.x1 += dx; el.y1 += dy;
        el.x2 += dx; el.y2 += dy;
      } else if (el.type === 'path' && el.points) {
        el.points.forEach(p => { p.x += dx; p.y += dy; });
      }
    }

    function removeNearElements(pos) {
      const prevLength = elements.length;
      elements = elements.filter(el => !isNearElement(pos, el));
      if (elements.length !== prevLength) {
        redraw();
        socket.emit('update-board', elements);
      }
    }

    function zoom(factor) {
      scale *= factor;
      redraw();
    }

    function resetZoom() {
      scale = 1; offsetX = 0; offsetY = 0;
      redraw();
    }

    function clearBoard() {
      elements = [];
      redraw();
      socket.emit('clear');
    }

    socket.on('init', (data) => { elements = data; redraw(); });
    socket.on('draw', (data) => { elements.push(data); redraw(); });
    socket.on('update-board', (data) => { elements = data; redraw(); });
    socket.on('clear', () => { elements = []; redraw(); });

    resizeCanvas();
  </script>
</body>
</html>
