<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tablero Matemático Interactivo Avanzado</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #111827; color: #fff; }
    
    #toolbar {
      position: absolute; top: 0; left: 0; right: 0; height: 54px;
      background: #1f2937; display: flex; align-items: center; padding: 0 10px; gap: 8px;
      z-index: 10; border-bottom: 1px solid #374151; overflow-x: auto; white-space: nowrap;
    }
    #toolbar select, #toolbar button, #toolbar input {
      background: #374151; color: #fff; border: 1px solid #4b5563; padding: 6px 12px;
      border-radius: 6px; font-size: 13px; cursor: pointer; outline: none; font-weight: 500;
      display: inline-flex; align-items: center; gap: 4px;
    }
    #toolbar button:hover, #toolbar select:hover { background: #4b5563; }
    
    #canvas-container { 
      position: absolute; top: 54px; bottom: 0; left: 0; right: 0; 
      background: #ffffff; cursor: crosshair; touch-action: none; 
    }
    canvas { display: block; width: 100%; height: 100%; }
    
    .btn-danger { background: #dc2626 !important; border-color: #ef4444 !important; }
    .btn-danger:hover { background: #b91c1c !important; }
    .btn-primary { background: #2563eb !important; border-color: #3b82f6 !important; }
    .btn-primary:hover { background: #1d4ed8 !important; }

    /* Modales de Configuración */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center;
    }
    .modal.active { display: flex; }
    .modal-card {
      background: #1f2937; border-radius: 12px; padding: 20px; width: 340px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #374151;
    }
    .modal-card h3 { margin-bottom: 15px; font-size: 16px; color: #f3f4f6; }
    .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 12px; color: #9ca3af; }
    .form-group input, .form-group select {
      background: #374151; border: 1px solid #4b5563; color: white; padding: 8px; border-radius: 6px; font-size: 14px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <div id="toolbar">
    <select id="toolSelect">
      <option value="pen">✏️ Lápiz</option>
      <option value="select">🖐️ Mover / Editar Objeto</option>
      <option value="pan">✋ Desplazar Pantalla</option>
      <option value="line">📏 Línea Recta</option>
      <option value="numberline">🔢 Recta Numérica</option>
      <option value="cartesian">📈 Plano Cartesiano</option>
      <option value="eraser">🧹 Borrador</option>
    </select>

    <input type="color" id="colorPicker" value="#000000">
    <select id="lineWidth">
      <option value="2">Fino (2px)</option>
      <option value="4" selected>Medio (4px)</option>
      <option value="8">Grueso (8px)</option>
    </select>

    <button onclick="insertSymbol('|x|')">|x|</button>
    <button onclick="insertSymbol('|-a|=a')">|-a|=a</button>
    <button onclick="insertSymbol('π')">π</button>
    <button onclick="insertSymbol('√x')">√x</button>
    <button onclick="insertSymbol('f(x)')">f(x)</button>

    <button onclick="zoom(1.15)">🔍 +</button>
    <button onclick="zoom(0.85)">🔍 -</button>
    <button onclick="resetZoom()">Centrar Vista</button>

    <button class="btn-danger" onclick="clearBoard()">Limpiar Tablero</button>
  </div>

  <div id="canvas-container">
    <canvas id="board"></canvas>
  </div>

  <!-- Modal Configuración Plano Cartesiano -->
  <div id="modalCartesian" class="modal">
    <div class="modal-card">
      <h3>📈 Configurar Plano Cartesiano</h3>
      <div class="form-group">
        <label>Mínimo en X (Ej: -20, 0):</label>
        <input type="number" id="cartMinX" value="-10">
      </div>
      <div class="form-group">
        <label>Máximo en X (Ej: 20, 10):</label>
        <input type="number" id="cartMaxX" value="10">
      </div>
      <div class="form-group">
        <label>Mínimo en Y (Ej: -10):</label>
        <input type="number" id="cartMinY" value="-10">
      </div>
      <div class="form-group">
        <label>Máximo en Y (Ej: 10):</label>
        <input type="number" id="cartMaxY" value="10">
      </div>
      <div class="form-group">
        <label>Paso / Escala (Ej: 1, 2, 5):</label>
        <input type="number" id="cartStep" value="2" min="1">
      </div>
      <div class="modal-actions">
        <button onclick="closeModals()">Cancelar</button>
        <button class="btn-primary" onclick="saveCartesianConfig()">Guardar / Insertar</button>
      </div>
    </div>
  </div>

  <!-- Modal Configuración Recta Numérica -->
  <div id="modalNumberLine" class="modal">
    <div class="modal-card">
      <h3>🔢 Configurar Recta Numérica</h3>
      <div class="form-group">
        <label>Valor Inicial / Mínimo (Ej: 0 o -20):</label>
        <input type="number" id="nlMin" value="-10">
      </div>
      <div class="form-group">
        <label>Valor Final / Máximo (Ej: 20 o 5):</label>
        <input type="number" id="nlMax" value="10">
      </div>
      <div class="form-group">
        <label>Paso / Incremento (Ej: 1, 2, 5):</label>
        <input type="number" id="nlStep" value="2" min="1">
      </div>
      <div class="modal-actions">
        <button onclick="closeModals()">Cancelar</button>
        <button class="btn-primary" onclick="saveNumberLineConfig()">Guardar / Insertar</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    let elements = [];
    let currentPath = null;

    let tool = 'pen';
    let color = '#000000';
    let size = 4;

    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;

    let isDrawing = false;
    let startX = 0, startY = 0;
    let lastMousePos = { x: 0, y: 0 };
    let selectedElement = null;
    let editingElement = null;
    let tempPlacementPos = null;

    function resizeCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      redraw();
    }
    window.addEventListener('resize', resizeCanvas);

    document.getElementById('toolSelect').addEventListener('change', (e) => {
      tool = e.target.value;
      canvas.style.cursor = tool === 'pan' ? 'grab' : (tool === 'select' ? 'pointer' : 'crosshair');
    });
    document.getElementById('colorPicker').addEventListener('change', (e) => color = e.target.value);
    document.getElementById('lineWidth').addEventListener('change', (e) => size = parseInt(e.target.value));

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left - offsetX) / scale,
        y: (clientY - rect.top - offsetY) / scale,
        rawX: clientX - rect.left,
        rawY: clientY - rect.top
      };
    }

    function startAction(e) {
      if (e.touches && e.touches.length > 1) return;
      isDrawing = true;
      const pos = getPos(e);
      startX = pos.x;
      startY = pos.y;
      lastMousePos = { x: pos.rawX, y: pos.rawY };

      if (tool === 'pen') {
        currentPath = { id: Date.now() + Math.random(), type: 'path', color, size, points: [{ x: pos.x, y: pos.y }] };
      } else if (tool === 'select') {
        selectedElement = elements.slice().reverse().find(el => isNearElement(pos, el));
      } else if (tool === 'eraser') {
        removeNearElements(pos);
      } else if (tool === 'cartesian') {
        tempPlacementPos = { x: pos.x, y: pos.y };
        editingElement = null;
        openCartesianModal({ minX: -10, maxX: 10, minY: -10, maxY: 10, step: 2 });
        isDrawing = false;
      } else if (tool === 'numberline') {
        tempPlacementPos = { x: pos.x, y: pos.y };
        editingElement = null;
        openNumberLineModal({ min: -10, max: 10, step: 2 });
        isDrawing = false;
      }
    }

    function moveAction(e) {
      if (!isDrawing) return;
      const pos = getPos(e);

      if (tool === 'pan') {
        const dx = pos.rawX - lastMousePos.x;
        const dy = pos.rawY - lastMousePos.y;
        offsetX += dx;
        offsetY += dy;
        lastMousePos = { x: pos.rawX, y: pos.rawY };
        redraw();
        return;
      }

      if (tool === 'pen' && currentPath) {
        currentPath.points.push({ x: pos.x, y: pos.y });
        redraw();
        drawElement(currentPath);
      } else if (tool === 'select' && selectedElement) {
        const dx = pos.x - startX;
        const dy = pos.y - startY;
        moveElement(selectedElement, dx, dy);
        startX = pos.x;
        startY = pos.y;
        redraw();
        socket.emit('update-board', elements);
      } else if (tool === 'eraser') {
        removeNearElements(pos);
      }
    }

    function endAction() {
      if (!isDrawing) return;
      isDrawing = false;

      if (tool === 'pen' && currentPath) {
        elements.push(currentPath);
        socket.emit('draw', currentPath);
        currentPath = null;
      } else if (tool === 'line') {
        const line = { id: Date.now(), type: 'line', x1: startX, y1: startY, x2: startX + 120, y2: startY, color, size };
        elements.push(line);
        socket.emit('draw', line);
        redraw();
      } else if (tool === 'select' && selectedElement) {
        socket.emit('update-board', elements);
        selectedElement = null;
      }
    }

    // Doble clic para reconfigurar el Plano Cartesiano o la Recta Numérica
    canvas.addEventListener('dblclick', (e) => {
      const pos = getPos(e);
      const clickedEl = elements.slice().reverse().find(el => isNearElement(pos, el));
      if (clickedEl) {
        if (clickedEl.type === 'cartesian') {
          editingElement = clickedEl;
          openCartesianModal(clickedEl);
        } else if (clickedEl.type === 'numberline') {
          editingElement = clickedEl;
          openNumberLineModal(clickedEl);
        }
      }
    });

    canvas.addEventListener('mousedown', startAction);
    canvas.addEventListener('mousemove', moveAction);
    canvas.addEventListener('mouseup', endAction);

    canvas.addEventListener('touchstart', (e) => startAction(e), { passive: true });
    canvas.addEventListener('touchmove', (e) => moveAction(e), { passive: true });
    canvas.addEventListener('touchend', endAction);

    function insertSymbol(text) {
      const pos = { x: (canvas.width / 2 - offsetX) / scale, y: (canvas.height / 2 - offsetY) / scale };
      const elem = { id: Date.now(), type: 'text', text, x: pos.x, y: pos.y, color, size: 28 };
      elements.push(elem);
      socket.emit('draw', elem);
      redraw();
    }

    // FUNCIÓN PRINCIPAL DE RENDERIZADO DEL PLANO Y ELEMENTOS
    function drawElement(el) {
      ctx.strokeStyle = el.color || '#000';
      ctx.fillStyle = el.color || '#000';
      ctx.lineWidth = el.size || 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (el.type === 'path') {
        if (!el.points || el.points.length < 2) return;
        ctx.beginPath();
        ctx.moveTo(el.points[0].x, el.points[0].y);
        for (let i = 1; i < el.points.length; i++) {
          ctx.lineTo(el.points[i].x, el.points[i].y);
        }
        ctx.stroke();
      } else if (el.type === 'text') {
        ctx.font = `bold ${el.size || 28}px sans-serif`;
        ctx.fillText(el.text, el.x, el.y);
      } else if (el.type === 'line') {
        ctx.beginPath();
        ctx.moveTo(el.x1, el.y1);
        ctx.lineTo(el.x2, el.y2);
        ctx.stroke();
      } else if (el.type === 'numberline') {
        const min = el.min !== undefined ? el.min : -10;
        const max = el.max !== undefined ? el.max : 10;
        const step = el.step || 2;
        const width = el.width || 420;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(el.x - width/2, el.y);
        ctx.lineTo(el.x + width/2, el.y);
        ctx.stroke();

        // Flechas en los extremos
        ctx.beginPath();
        ctx.moveTo(el.x - width/2, el.y); ctx.lineTo(el.x - width/2 + 8, el.y - 5);
        ctx.moveTo(el.x - width/2, el.y); ctx.lineTo(el.x - width/2 + 8, el.y + 5);
        ctx.moveTo(el.x + width/2, el.y); ctx.lineTo(el.x + width/2 - 8, el.y - 5);
        ctx.moveTo(el.x + width/2, el.y); ctx.lineTo(el.x + width/2 - 8, el.y + 5);
        ctx.stroke();

        const totalRange = max - min;
        if (totalRange > 0) {
          ctx.font = '12px sans-serif';
          ctx.textAlign = 'center';
          for (let val = min; val <= max; val += step) {
            const pct = (val - min) / totalRange;
            const px = (el.x - width/2) + pct * width;
            
            ctx.beginPath();
            ctx.moveTo(px, el.y - 6);
            ctx.lineTo(px, el.y + 6);
            ctx.stroke();

            ctx.fillText(val.toString(), px, el.y + 22);
          }
        }
        ctx.restore();
      } else if (el.type === 'cartesian') {
        const minX = el.minX !== undefined ? el.minX : -10;
        const maxX = el.maxX !== undefined ? el.maxX : 10;
        const minY = el.minY !== undefined ? el.minY : -10;
        const maxY = el.maxY !== undefined ? el.maxY : 10;
        const step = el.step || 2;
        const w = el.w || 340;
        const h = el.h || 340;

        ctx.save();
        const rangeX = maxX - minX;
        const rangeY = maxY - minY;

        if (rangeX <= 0 || rangeY <= 0) return;

        const originX = el.x - w/2 + ((0 - minX) / rangeX) * w;
        const originY = el.y + h/2 - ((0 - minY) / rangeY) * h;

        // Cuadrícula suave de fondo
        ctx.strokeStyle = '#e5e7eb';
        ctx.lineWidth = 1;

        for (let val = minX; val <= maxX; val += step) {
          const px = el.x - w/2 + ((val - minX) / rangeX) * w;
          ctx.beginPath(); ctx.moveTo(px, el.y - h/2); ctx.lineTo(px, el.y + h/2); ctx.stroke();
        }
        for (let val = minY; val <= maxY; val += step) {
          const py = el.y + h/2 - ((val - minY) / rangeY) * h;
          ctx.beginPath(); ctx.moveTo(el.x - w/2, py); ctx.lineTo(el.x + w/2, py); ctx.stroke();
        }

        // Ejes X e Y
        ctx.strokeStyle = el.color || '#000';
        ctx.lineWidth = (el.size || 2) + 1;

        ctx.beginPath();
        ctx.moveTo(el.x - w/2, originY);
        ctx.lineTo(el.x + w/2, originY);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(originX, el.y - h/2);
        ctx.lineTo(originX, el.y + h/2);
        ctx.stroke();

        // Flechas
        ctx.beginPath();
        ctx.moveTo(el.x + w/2, originY); ctx.lineTo(el.x + w/2 - 8, originY - 5);
        ctx.moveTo(el.x + w/2, originY); ctx.lineTo(el.x + w/2 - 8, originY + 5);
        ctx.moveTo(originX, el.y - h/2); ctx.lineTo(originX - 5, el.y - h/2 + 8);
        ctx.moveTo(originX, el.y - h/2); ctx.lineTo(originX + 5, el.y - h/2 + 8);
        ctx.stroke();

        // Números y graduación
        ctx.font = '11px sans-serif';
        ctx.fillStyle = el.color || '#000';

        ctx.textAlign = 'center';
        for (let val = minX; val <= maxX; val += step) {
          if (val === 0 && (originY >= el.y - h/2 && originY <= el.y + h/2)) continue;
          const px = el.x - w/2 + ((val - minX) / rangeX) * w;
          ctx.beginPath();
          ctx.moveTo(px, originY - 4);
          ctx.lineTo(px, originY + 4);
          ctx.stroke();
          ctx.fillText(val.toString(), px, originY + 16);
        }

        ctx.textAlign = 'right';
        for (let val = minY; val <= maxY; val += step) {
          if (val === 0) continue;
          const py = el.y + h/2 - ((val - minY) / rangeY) * h;
          ctx.beginPath();
          ctx.moveTo(originX - 4, py);
          ctx.lineTo(originX + 4, py);
          ctx.stroke();
          ctx.fillText(val.toString(), originX - 7, py + 4);
        }

        ctx.font = 'bold 13px sans-serif';
        ctx.fillText("X", el.x + w/2 + 12, originY + 4);
        ctx.fillText("Y", originX + 4, el.y - h/2 - 8);

        ctx.restore();
      }
    }

    function redraw() {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);
      elements.forEach(drawElement);
      if (currentPath) drawElement(currentPath);
      ctx.restore();
    }

    function isNearElement(pos, el) {
      if (el.type === 'text' || el.type === 'numberline' || el.type === 'cartesian') {
        return Math.hypot(pos.x - el.x, pos.y - el.y) < 100;
      }
      if (el.type === 'line') {
        return Math.hypot(pos.x - el.x1, pos.y - el.y1) < 50;
      }
      if (el.type === 'path' && el.points) {
        return el.points.some(p => Math.hypot(pos.x - p.x, pos.y - p.y) < 20);
      }
      return false;
    }

    function moveElement(el, dx, dy) {
      if (el.type === 'text' || el.type === 'numberline' || el.type === 'cartesian') {
        el.x += dx; el.y += dy;
      } else if (el.type === 'line') {
        el.x1 += dx; el.y1 += dy;
        el.x2 += dx; el.y2 += dy;
      } else if (el.type === 'path' && el.points) {
        el.points.forEach(p => { p.x += dx; p.y += dy; });
      }
    }

    function removeNearElements(pos) {
      const prevLength = elements.length;
      elements = elements.filter(el => !isNearElement(pos, el));
      if (elements.length !== prevLength) {
        redraw();
        socket.emit('update-board', elements);
      }
    }

    function openCartesianModal(data) {
      document.getElementById('cartMinX').value = data.minX !== undefined ? data.minX : -10;
      document.getElementById('cartMaxX').value = data.maxX !== undefined ? data.maxX : 10;
      document.getElementById('cartMinY').value = data.minY !== undefined ? data.minY : -10;
      document.getElementById('cartMaxY').value = data.maxY !== undefined ? data.maxY : 10;
      document.getElementById('cartStep').value = data.step || 2;
      document.getElementById('modalCartesian').classList.add('active');
    }

    function openNumberLineModal(data) {
      document.getElementById('nlMin').value = data.min !== undefined ? data.min : -10;
      document.getElementById('nlMax').value = data.max !== undefined ? data.max : 10;
      document.getElementById('nlStep').value = data.step || 2;
      document.getElementById('modalNumberLine').classList.add('active');
    }

    function closeModals() {
      document.getElementById('modalCartesian').classList.remove('active');
      document.getElementById('modalNumberLine').classList.remove('active');
      tempPlacementPos = null;
      editingElement = null;
    }

    function saveCartesianConfig() {
      const minX = parseFloat(document.getElementById('cartMinX').value);
      const maxX = parseFloat(document.getElementById('cartMaxX').value);
      const minY = parseFloat(document.getElementById('cartMinY').value);
      const maxY = parseFloat(document.getElementById('cartMaxY').value);
      const step = parseFloat(document.getElementById('cartStep').value) || 1;

      if (editingElement) {
        editingElement.minX = minX;
        editingElement.maxX = maxX;
        editingElement.minY = minY;
        editingElement.maxY = maxY;
        editingElement.step = step;
        socket.emit('update-board', elements);
      } else if (tempPlacementPos) {
        const cart = {
          id: Date.now(), type: 'cartesian',
          x: tempPlacementPos.x, y: tempPlacementPos.y,
          minX, maxX, minY, maxY, step,
          w: 340, h: 340, color, size: 2
        };
        elements.push(cart);
        socket.emit('draw', cart);
      }
      closeModals();
      redraw();
    }

    function saveNumberLineConfig() {
      const min = parseFloat(document.getElementById('nlMin').value);
      const max = parseFloat(document.getElementById('nlMax').value);
      const step = parseFloat(document.getElementById('nlStep').value) || 1;

      if (editingElement) {
        editingElement.min = min;
        editingElement.max = max;
        editingElement.step = step;
        socket.emit('update-board', elements);
      } else if (tempPlacementPos) {
        const nl = {
          id: Date.now(), type: 'numberline',
          x: tempPlacementPos.x, y: tempPlacementPos.y,
          min, max, step,
          width: 450, color, size: 2
        };
        elements.push(nl);
        socket.emit('draw', nl);
      }
      closeModals();
      redraw();
    }

    function zoom(factor) {
      scale *= factor;
      redraw();
    }

    function resetZoom() {
      scale = 1; offsetX = 0; offsetY = 0;
      redraw();
    }

    function clearBoard() {
      elements = [];
      redraw();
      socket.emit('clear');
    }

    socket.on('init', (data) => { elements = data; redraw(); });
    socket.on('draw', (data) => { elements.push(data); redraw(); });
    socket.on('update-board', (data) => { elements = data; redraw(); });
    socket.on('clear', () => { elements = []; redraw(); });

    resizeCanvas();
  </script>
</body>
</html>
