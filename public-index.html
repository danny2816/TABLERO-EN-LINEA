<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Matemático Interactivo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #toolbar { background: #0f172a; color: #fff; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; z-index: 10; }
        button, select, input { padding: 6px 12px; border-radius: 4px; border: 1px solid #334155; background: #1e293b; color: white; cursor: pointer; }
        button:hover { background: #334155; }
        #canvas-container { flex-grow: 1; position: relative; background: #ffffff; cursor: crosshair; }
        canvas { display: block; }
    </style>
</head>
<body>

<div id="toolbar">
    <select id="tool">
        <option value="pen">Lápiz</option>
        <option value="marker">Marcador (Resaltador)</option>
        <option value="text">Texto / Símbolo</option>
        <option value="cartesian">Plano Cartesiano</option>
        <option value="numberline">Recta Numérica</option>
        <option value="abs">Valor Absoluto |x|</option>
    </select>

    <input type="color" id="color" value="#000000">
    <input type="number" id="size" value="2" min="1" max="50" style="width: 60px;">

    <button onclick="insertSymbol('|x|')">|x|</option>
    <button onclick="insertSymbol('|-a| = a')">|-a|=a</button>
    <button onclick="insertSymbol('π')">π</button>
    <button onclick="insertSymbol('√x')">√x</button>
    <button onclick="insertSymbol('∛x')">∛x</button>
    <button onclick="insertSymbol('f(x) = ')">f(x)</button>

    <button onclick="zoom(1.2)">🔍 +</button>
    <button onclick="zoom(0.8)">🔍 -</button>
    <button onclick="resetView()">Centrar Vista</button>
    <button onclick="clearBoard()" style="background: #dc2626;">Limpiar Tablero</button>
</div>

<div id="canvas-container">
    <canvas id="board"></canvas>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');

let isDrawing = false, startX, startY;
let scale = 1, offsetX = 0, offsetY = 0;
let isPanning = false, panStartX, panStartY;
let localActions = [];

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight - document.getElementById('toolbar').offsetHeight;
    render();
}
window.addEventListener('resize', resize);

canvas.addEventListener('mousedown', (e) => {
    if (e.button === 1 || e.shiftKey) {
        isPanning = true;
        panStartX = e.clientX - offsetX;
        panStartY = e.clientY - offsetY;
        return;
    }

    isDrawing = true;
    const pos = getTransformedPoint(e.clientX, e.clientY);
    startX = pos.x; startY = pos.y;

    const tool = document.getElementById('tool').value;
    const color = document.getElementById('color').value;
    const size = parseInt(document.getElementById('size').value);

    if (tool === 'text') {
        const text = prompt("Ingrese la expresión o valor:");
        if (text) {
            const action = { type: 'text', x: startX, y: startY, text, color, size: size * 8 };
            socket.emit('draw-action', action);
            drawElement(action);
        }
        isDrawing = false;
    } else if (tool === 'cartesian') {
        const action = { type: 'cartesian', x: startX, y: startY, color, size };
        socket.emit('draw-action', action);
        drawElement(action);
        isDrawing = false;
    } else if (tool === 'numberline') {
        const action = { type: 'numberline', x: startX, y: startY, color, size };
        socket.emit('draw-action', action);
        drawElement(action);
        isDrawing = false;
    } else if (tool === 'abs') {
        const val = prompt("Expresión para Valor Absoluto:", "x - 5");
        if (val) {
            const text = `|${val}|`;
            const action = { type: 'text', x: startX, y: startY, text, color, size: size * 10 };
            socket.emit('draw-action', action);
            drawElement(action);
        }
        isDrawing = false;
    }
});

canvas.addEventListener('mousemove', (e) => {
    if (isPanning) {
        offsetX = e.clientX - panStartX;
        offsetY = e.clientY - panStartY;
        render();
        return;
    }
    if (!isDrawing) return;
    const pos = getTransformedPoint(e.clientX, e.clientY);
    const tool = document.getElementById('tool').value;
    const color = document.getElementById('color').value;
    const size = parseInt(document.getElementById('size').value);

    if (tool === 'pen' || tool === 'marker') {
        const action = {
            type: 'line',
            x1: startX, y1: startY, x2: pos.x, y2: pos.y,
            color: tool === 'marker' ? color + '44' : color,
            size: tool === 'marker' ? size * 4 : size
        };
        socket.emit('draw-action', action);
        drawElement(action);
        startX = pos.x; startY = pos.y;
    }
});

canvas.addEventListener('mouseup', () => { isDrawing = false; isPanning = false; });

function getTransformedPoint(x, y) {
    const rect = canvas.getBoundingClientRect();
    return { x: (x - rect.left - offsetX) / scale, y: (y - rect.top - offsetY) / scale };
}

function zoom(factor) { scale *= factor; render(); }
function resetView() { scale = 1; offsetX = 0; offsetY = 0; render(); }

function render() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.translate(offsetX, offsetY);
    ctx.scale(scale, scale);
    localActions.forEach(drawElement);
    ctx.restore();
}

function drawElement(action) {
    localActions.push(action);
    ctx.beginPath();
    ctx.strokeStyle = action.color;
    ctx.fillStyle = action.color;
    ctx.lineWidth = action.size;

    if (action.type === 'line') {
        ctx.moveTo(action.x1, action.y1);
        ctx.lineTo(action.x2, action.y2);
        ctx.stroke();
    } else if (action.type === 'text') {
        ctx.font = `${action.size}px sans-serif`;
        ctx.fillText(action.text, action.x, action.y);
    } else if (action.type === 'cartesian') {
        drawCartesianGrid(action.x, action.y);
    } else if (action.type === 'numberline') {
        drawNumberLine(action.x, action.y);
    }
}

function drawCartesianGrid(cx, cy) {
    const size = 200, step = 20;
    ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1;
    for (let x = -size; x <= size; x += step) {
        ctx.beginPath(); ctx.moveTo(cx + x, cy - size); ctx.lineTo(cx + x, cy + size); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx - size, cy + x); ctx.lineTo(cx + size, cy + x); ctx.stroke();
    }
    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - size, cy); ctx.lineTo(cx + size, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy - size); ctx.lineTo(cx, cy + size); ctx.stroke();
}

function drawNumberLine(cx, cy) {
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - 150, cy); ctx.lineTo(cx + 150, cy); ctx.stroke();
    for (let i = -5; i <= 5; i++) {
        const x = cx + i * 25;
        ctx.beginPath(); ctx.moveTo(x, cy - 5); ctx.lineTo(x, cy + 5); ctx.stroke();
        ctx.font = '12px sans-serif'; ctx.fillText(i.toString(), x - 4, cy + 20);
    }
}

function insertSymbol(sym) {
    document.getElementById('tool').value = 'text';
    const action = { type: 'text', x: 100, y: 100, text: sym, color: document.getElementById('color').value, size: 30 };
    socket.emit('draw-action', action);
    drawElement(action);
}

function clearBoard() { socket.emit('clear-board'); }

socket.on('init-board', (actions) => { localActions = []; actions.forEach(drawElement); });
socket.on('draw-action', (action) => drawElement(action));
socket.on('clear-board', () => { localActions = []; render(); });

resize();
</script>
</body>
</html>
